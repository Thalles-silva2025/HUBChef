    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {

            }

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
      
      /* Esconde a barra de rolagem visualmente, mas mantém a função */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Print Styles override */
      @media print {
        @page { size: A4; margin: 1cm; }
        html, body { height: auto !important; overflow: visible !important; margin: 0 !important; }
        body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .no-print { display: none !important; }
        
        /* Ensure proper page breaking */
        .page-break { page-break-before: always; }
        .avoid-break { page-break-inside: avoid; break-inside: avoid; }
        
        /* Reset containers to allow flow */
        #root, #root > div { height: auto !important; overflow: visible !important; display: block !important; }
      }
    </style>
